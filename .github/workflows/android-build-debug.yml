      - name: Install Android commandline tools and SDK components (robust)
        run: |
          set -eux

          # variáveis
          ANDROID_CMDLINE_ZIP_URL="https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip"
          TMP_ZIP="/tmp/cmdline-tools.zip"

          # garantir ferramentas
          sudo apt-get update
          sudo apt-get install -y unzip wget zip

          # preparar diretório do SDK
          sudo mkdir -p $ANDROID_SDK_ROOT
          sudo chown -R $USER:$USER $ANDROID_SDK_ROOT
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools

          # baixar e extrair
          wget -O "$TMP_ZIP" "$ANDROID_CMDLINE_ZIP_URL"
          unzip -q "$TMP_ZIP" -d "$ANDROID_SDK_ROOT/cmdline-tools"

          # Algumas versões colocam os arquivos em cmdline-tools/cmdline-tools/*, outras em cmdline-tools/*
          # Normaliza para .../cmdline-tools/latest
          if [ -d "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" ]; then
            mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools/latest"
            mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools/"* "$ANDROID_SDK_ROOT/cmdline-tools/latest/"
          else
            # move tudo para latest
            mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools/latest"
            mv "$ANDROID_SDK_ROOT/cmdline-tools/"* "$ANDROID_SDK_ROOT/cmdline-tools/latest/" || true
          fi

          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"

          # debug info (ajuda a diagnosticar em caso de falha)
          java -version || true
          ls -la $ANDROID_SDK_ROOT
          ls -la $ANDROID_SDK_ROOT/cmdline-tools || true
          sdkmanager --version || true

          # instalar componentes (aceita automaticamente)
          yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" "platform-tools" "platforms;android-33" "build-tools;33.0.2"
