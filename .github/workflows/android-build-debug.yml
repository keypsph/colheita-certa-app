name: Build Android Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/start-finish-period-and-rename

env:
  ANDROID_SDK_ROOT: /usr/local/android-sdk

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Debug: Node / NPM versions
        run: |
          node -v
          npm -v
          npx -v || true

      - name: Install prereq tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip wget zip

      - name: Download and install Android commandline tools
        run: |
          set -eux
          TMP_ZIP="/tmp/cmdline-tools.zip"
          wget -O "$TMP_ZIP" "https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip"
          sudo mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          sudo unzip -q "$TMP_ZIP" -d "$ANDROID_SDK_ROOT/cmdline-tools"
          if [ -d "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" ]; then
            sudo mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools/latest"
            sudo mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools/"* "$ANDROID_SDK_ROOT/cmdline-tools/latest/"
          else
            sudo mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools/latest"
            sudo mv "$ANDROID_SDK_ROOT/cmdline-tools/"* "$ANDROID_SDK_ROOT/cmdline-tools/latest/" || true
          fi
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" "platform-tools" "platforms;android-33" "build-tools;33.0.2"

      - name: Accept Android SDK licenses
        run: |
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses --sdk_root="$ANDROID_SDK_ROOT"

      - name: Debug env
        run: |
          echo "JAVA_HOME=${JAVA_HOME:-not-set}"
          node -v
          npm -v
          env | sort

      - name: Install dependencies (verbose, fallback)
        run: |
          set -eux
          npm ci --loglevel verbose || (npm cache verify || true; npm install --legacy-peer-deps --loglevel verbose)

      - name: Build web assets (Vite)
        run: npm run build

      - name: Install Capacitor CLI locally
        run: npm i --no-save @capacitor/cli @capacitor/core

      - name: Init Capacitor (if needed)
        run: |
          if [ ! -d android ]; then
            npx cap init "SLX Comperative" "com.example.slxcomperative" --web-dir=dist
          fi

      - name: Add Android platform
        run: npx cap add android || true

      - name: Copy web build to Android project
        run: npx cap copy android

      - name: Ensure gradlew executable
        run: chmod +x android/gradlew || true

      - name: Build Android debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
